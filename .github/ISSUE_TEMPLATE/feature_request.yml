name: Feature request
description: Suggest an improvement or a new capability.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: 'Describe the need this feature would address and how it would help.'
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the use case or limitation you have encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like the calculator to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples, sketches, or context that would help evaluate the request.
    validations:
      required: false
